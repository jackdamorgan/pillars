</style></head><body><header class="top"><div class="top-in"><span class="brand">▥ <span>PILLARS</span></span><nav id="nav" aria-label="Main navigation"></nav><button class="log" data-action="log">+ Log</button><details class="menu"><summary>Menu</summary><div><button data-page="setup">Setup</button><button data-page="backup">Backup</button><button data-page="progress">Gates & levels</button></div></details></div></header><main><div id="intro"></div><div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main><footer>Records stay in this browser. Save downloaded backups outside the repository. Weekly Notion export is manual. <span>Phase 1 · detailed workspaces follow in later phases.</span></footer><script type="module">
// core
const KEY='pillars-v1';
const id=()=>crypto.randomUUID();
const today=()=>new Date().toLocaleDateString('en-CA');
const collections=['entries','priorities','blocks','reviews','gates','nodes','levels'];
function emptyState(){return {schemaVersion:1,revision:0,settings:{trialStart:null,backupFolderConfirmed:false,baselineImported:false},entries:[],priorities:[],blocks:[],reviews:[],gates:[],nodes:[],levels:[]};}
function validDate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}
function validateState(v){
 if(!v||typeof v!=='object'||Array.isArray(v)||v.schemaVersion!==1)throw Error('This is not a supported Pillars backup.');
 if(!Number.isSafeInteger(v.revision)||v.revision<0)throw Error('Invalid revision.');
 if(!v.settings||typeof v.settings!=='object'||Array.isArray(v.settings))throw Error('Settings are missing.');
 if(v.settings.trialStart!==null&&!validDate(v.settings.trialStart))throw Error('Invalid trial start.');
 const ids=new Set();for(const name of collections){if(!Array.isArray(v[name])||v[name].length>50000)throw Error('Invalid '+name);for(const r of v[name]){if(!r||typeof r!=='object'||typeof r.id!=='string'||!r.id||ids.has(r.id))throw Error('Missing or duplicate record ID.');ids.add(r.id);if(r.date!==undefined&&!validDate(r.date))throw Error('Invalid date.');}}
 const raw=JSON.stringify(v);if(raw.length>5000000)throw Error('Backup exceeds 5 MB trial limit.');return JSON.parse(raw);
}
function encodeBackup(s){return JSON.stringify({format:'pillars-backup',exportedAt:new Date().toISOString(),data:validateState(s)},null,2);}
function decodeBackup(raw){if(typeof raw!=='string'||raw.length>6000000)throw Error('Choose a backup smaller than 6 MB.');let p;try{p=JSON.parse(raw);}catch{throw Error('Backup is not valid JSON.');}if(p.format!=='pillars-backup')throw Error('Choose a full Pillars JSON backup.');return validateState(p.data);}
function createStore(storage,key=KEY){const read=()=>{const raw=storage.getItem(key);return raw===null?emptyState():validateState(JSON.parse(raw));};return {read,save:(s,expected=s.revision)=>{const current=read();if(current.revision!==expected)throw Error('Another tab changed records. Reload before saving; your form was not cleared.');const next=validateState({...s,revision:current.revision+1});storage.setItem(key,JSON.stringify(next));return next;},restore:(raw,expected)=>{const next=decodeBackup(raw);if(expected!==undefined&&read().revision!==expected)throw Error('Another tab changed records. Reload before restoring.');storage.setItem(key,JSON.stringify(next));return next;}};}

// domain

function shiftDate(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function weekStart(date){return shiftDate(date,-new Date(date+'T12:00:00Z').getUTCDay());}
const schedule=[['Strength','strength',0,'13:00','13:20'],['Project / Bootcamp','project',1,'12:30','13:45'],['University','uni',2,'12:30','14:00'],['Strength','strength',3,'13:00','13:20'],['Project / Bootcamp','project',4,'12:30','13:45'],['Project / Bootcamp','project',5,'12:30','14:00'],['Finance','finance',5,'14:00','14:10'],['Weekly review','review',6,'After Shabbat','30 min']];
function blocksFor(s,week){return schedule.map(([title,track,day,start,end],i)=>{const key=week+':'+i;return s.blocks.find(b=>b.key===key)||{id:'block-'+key,key,week,date:shiftDate(week,day),title,track,start,end,status:'planned',outcome:''};});}
function addPriority(s,week,text){if(s.priorities.filter(p=>p.week===week).length>=4)throw Error('Four priorities is the limit. Edit an existing priority or choose another week.');if(!text.trim())throw Error('Enter a priority.');s.priorities.push({id:id(),week,text:text.trim(),status:'open'});}
function saveBlock(s,block,status,outcome){if(!['planned','done','fallback','reallocated','missed'].includes(status))throw Error('Invalid block status.');if(['done','fallback'].includes(status)&&!outcome.trim())throw Error('Describe the actual work before marking this block complete.');if(status==='reallocated'&&block.track!=='project')throw Error('Only project blocks can be reallocated to University.');if(['done','fallback','missed'].includes(status)&&block.date>today())throw Error('Future blocks cannot be marked completed or missed.');const next={...block,status,outcome:outcome.trim(),effectiveTrack:status==='reallocated'?'uni':block.track,completion:status==='reallocated'?(block.status==='reallocated'?block.completion:'planned'):status};const index=s.blocks.findIndex(b=>b.key===block.key);if(index<0)s.blocks.push(next);else s.blocks[index]=next;}

// debrief

function saveDebrief(state,input){
 const {date,weak,fix,sleep='',energy=''}=input;
 if(!validDate(date))throw Error('Choose a valid date.');
 if(!weak?.trim()||!fix?.trim())throw Error('Enter one weak point and one fix.');
 for(const [label,v,min,max] of [['Sleep',sleep,0,24],['Energy',energy,1,10]])if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<min||Number(v)>max))throw Error(`${label} must be between ${min} and ${max}.`);
 const old=state.entries.find(e=>e.kind==='debrief'&&e.date===date);
 const row={id:old?.id??id(),kind:'debrief',date,weak:weak.trim(),fix:fix.trim(),sleep:sleep===''?null:Number(sleep),energy:energy===''?null:Number(energy)};
 if(old)state.entries[state.entries.indexOf(old)]=row;else state.entries.push(row);
 return row;
}

// practice


function savePractice(s,track,f){
 const date=f.date||today(),mode=f.mode||'practice';
 if(!validDate(date)||date>today())throw Error('Use today or a past date for completed work.');
 if(!f.work?.trim())throw Error('Describe what you actually did.');
 if(!['practice','fallback'].includes(mode))throw Error('Choose practice or fallback.');
 const row={...f,id:id(),kind:'practice',track,date,mode,work:f.work.trim()};
 if(f.block){const b=blocksFor(s,weekStart(date)).find(b=>b.key===f.block);if(!b||b.date!==date||(b.effectiveTrack||b.track)!==track)throw Error('Choose a block on the same date and track, or leave it unlinked.');const next={...b,status:b.status==='reallocated'?'reallocated':mode==='fallback'?'fallback':'done',completion:mode==='fallback'?'fallback':'done',effectiveTrack:track,outcome:row.work};const i=s.blocks.findIndex(x=>x.key===b.key);if(i<0)s.blocks.push(next);else s.blocks[i]=next;row.block=b.key;}
 s.entries.push(row);return row;
}
function strengthMissing(e){if(e.mode==='fallback')return ['Fallback supports continuity; it cannot pass the gate.'];return [!e.sets&&'Set breakdown and clean reps',!e.comparison&&'Comparison with another session'].filter(Boolean);}

// risk
const tracks={strength:'Strength',project:'Project / Bootcamp',uni:'University',finance:'Finance',combat:'Combat + Competition',courage:'Courage',speech:'Speech',politics:'Politics & History',creativity:'Creativity',cooking:'Cooking',outdoors:'Outdoorsmanship + First Aid',responsibility:'Responsibility',dress:'Dress'};
const maintenance=Object.keys(tracks).slice(4);
function riskFor(s,track,asOf){const thresholds=['uni','finance'].includes(track)?[8,10]:maintenance.includes(track)?[10,14]:[5,7];const activity=s.entries.filter(e=>e.kind==='practice'&&e.track===track&&e.date<=asOf).map(e=>({date:e.date,fallback:e.mode==='fallback'}));for(const b of s.blocks)if((b.effectiveTrack||b.track)===track&&b.date<=asOf&&['done','fallback'].includes(b.completion||b.status))activity.push({date:b.date,fallback:(b.completion||b.status)==='fallback'});activity.sort((a,b)=>b.date.localeCompare(a.date));const last=activity[0]?.date,substantive=activity.find(e=>!e.fallback)?.date;const days=last?Math.floor((Date.parse(asOf+'T12:00:00Z')-Date.parse(last+'T12:00:00Z'))/86400000):null;return {last,substantive,days,thresholds,status:days===null?'Baseline needed':days>thresholds[1]?'Red':days>thresholds[0]?'Amber':'Current'};}

// review

function qualifyingDays(s,week,asOf=today()){const end=shiftDate(week,6),days=new Set();const add=d=>{if(d>=week&&d<=end&&d<=asOf)days.add(d);};for(const b of s.blocks)if(['done','fallback'].includes(b.completion||b.status)&&b.outcome?.trim()&&b.track!=='review')add(b.date);for(const e of s.entries)if(e.kind==='practice'&&e.mode==='fallback'&&e.work?.trim())add(e.date);for(const r of s.reviews)if(r.adjustment?.trim())add(r.date);return [...days].sort();}
function saveReview(s,input){const date=input.date||today();if(!validDate(date)||date>today())throw Error('Review date must be today or earlier.');if(date<shiftDate(input.week,6))throw Error('Complete this review on Saturday or later.');if(!input.adjustment?.trim())throw Error('Record one adjustment for next week.');if(input.weight!==''&&input.weight!==undefined&&(!Number.isFinite(Number(input.weight))||Number(input.weight)<=0))throw Error('Enter a positive weight or leave it blank.');const old=s.reviews.find(r=>r.week===input.week);const row={...input,id:old?.id||id(),date,exportChecked:false};if(old)s.reviews[s.reviews.indexOf(old)]=row;else s.reviews.push(row);return row;}
function notionSummary(s,week){const r=s.reviews.find(r=>r.week===week);return [`# Pillars · ${week} to ${shiftDate(week,6)}`,'','## Main priorities',...s.priorities.filter(p=>p.week===week).map(p=>`- ${p.status}: ${p.text}`),'','## Pillar gates (separate from priorities)',...s.gates.filter(g=>g.week===week).map(g=>`- ${g.track}: ${g.status} — ${g.criteria}`),'','## Scheduled blocks',...s.blocks.filter(b=>b.week===week).map(b=>`- ${b.date} · ${b.title}: ${b.status}${b.status==='reallocated'?' to University ('+b.completion+')':''} — ${b.outcome}`),'','## Actual work',...s.entries.filter(e=>e.kind==='practice'&&e.date>=week&&e.date<=shiftDate(week,6)).map(e=>`- ${e.date} · ${e.track} · ${e.mode}: ${e.work}${e.result?' — '+e.result:''}${e.sets?' | Sets: '+e.sets:''}${e.comparison?' | Comparison: '+e.comparison:''}${e.module?' | Module: '+e.module:''}${e.submitted?' | Submission: '+e.submitted:''}${e.checked?' | Check: '+e.checked:''}${e.decision?' | Decision: '+e.decision:''}`),'','## Review',`Qualifying days: ${qualifyingDays(s,week).length}/7`,`Next adjustment: ${r?.adjustment||'Review not completed'}`,'','Levels are manually assessed; no automatic promotion.'].join('\n');}
function trialStatus(s,asOf=today()){const start=s.settings.trialStart;if(!start)return {label:'Trial not started'};const weeks=[start,shiftDate(start,7)];const results=weeks.map(week=>({week,days:qualifyingDays(s,week,asOf).length,review:!!s.reviews.find(r=>r.week===week&&r.exportChecked)}));const finished=asOf>=shiftDate(start,14);return {results,label:!finished?'Trial in progress':results.every(r=>r.days>=5&&r.review)?'Trial passed — expansion may be considered':'Simplify the setup and repeat the trial before expanding'};}

// progress

const gateDefaults={strength:'Two sessions with total and clean reps by set, plus a comparison.',project:'Complete one chosen deliverable and record observed behaviour against an expected result.',uni:'Complete the next assignment step and record submission status.',finance:'Complete the check, resolve or identify uncertainties and choose one next action.'};
function gateMissing(s,track,week,ids){const ev=s.entries.filter(e=>ids.includes(e.id)&&e.kind==='practice'&&e.track===track&&e.mode==='practice'&&e.date>=week&&e.date<=shiftDate(week,6));const gaps=[];if(!ev.length)gaps.push('Link substantive evidence from this track and week');if(track==='strength'){if(new Set(ev.map(e=>e.date)).size<2)gaps.push('Two session dates');if(ev.some(e=>!e.sets))gaps.push('Set details and clean reps');if(!ev.some(e=>e.comparison))gaps.push('Session comparison');}if(track==='project'&&!ev.some(e=>e.result))gaps.push('Observed result');if(track==='uni'&&!ev.some(e=>e.submitted&&e.submitted!=='unknown'))gaps.push('Submission status');if(track==='finance'&&!ev.some(e=>e.checked==='checked'&&e.decision))gaps.push('Completed check and next decision');return gaps;}
function assessGate(s,{track,week,criteria,status,evidence=[],confirmed=false}){if(!criteria?.trim())throw Error('Describe the gate criteria.');const missing=gateMissing(s,track,week,evidence);if(status==='Met'&&(missing.length||!confirmed))throw Error('Cannot mark Met: '+[...missing,...(!confirmed?['confirm that the evidence meets the full criteria']:[])].join('; '));const old=s.gates.find(g=>g.track===track&&g.week===week);const g={id:old?.id||id(),track,week,criteria,status,evidence,confirmed,missing};if(old)s.gates[s.gates.indexOf(old)]=g;else s.gates.push(g);}
const levelNames=['Untrained','Foundational','Functional','Proficient','Advanced','Mastery'];
function assessLevel(s,{track,level,rationale,evidence=[]}){const n=Number(level);if(!Number.isInteger(n)||n<1||n>6||!rationale?.trim())throw Error('Choose a level and explain the assessment.');const ev=s.entries.filter(e=>evidence.includes(e.id)&&e.track===track&&e.kind==='practice'&&e.mode==='practice');if(n>3&&new Set(ev.map(e=>e.date)).size<2)throw Error('Above Functional needs substantive evidence on at least two dates and your verification against the level criteria.');s.levels.push({id:id(),track,level:n,rationale,evidence,date:new Date().toLocaleDateString('en-CA')});}

// Schema v2 extends the original domain functions. Personal values are never seeded.
const PILLARS=[['strength','Strength'],['combat','Combat + Competition'],['courage','Courage'],['speech','Speech'],['industry','Industry'],['politics','Politics & History'],['finance','Finance'],['creativity','Creativity'],['cooking','Cooking'],['outdoors','Outdoorsmanship + First Aid'],['responsibility','Responsibility'],['dress','Dress']];
const PIDS=PILLARS.map(p=>p[0]);
const GATE_STATUSES=['Planned','In progress','Met','Partial','Missed','Blocked'];
const FALLBACKS={strength:'5 minutes of recovery or mobility',combat:'Review one technique cue',courage:'State one small preference',speech:'Check one explanation was understood',project:'10 minutes reproducing one behaviour',uni:'10 minutes reviewing the next assignment brief and identifying the next step',politics:'Read one reliable source',finance:'Review one outstanding uncertainty and choose the next check',creativity:'Write one original detail',cooking:'Prepare one simple component',outdoors:'Recall one safety step, then verify it',responsibility:'Review one commitment',dress:'Sort one item'};
const v1Empty=emptyState,v1Validate=validateState,v1SaveDebrief=saveDebrief,v1Risk=riskFor,v1GateMissing=gateMissing,v1SaveBlock=saveBlock,v1SavePractice=savePractice,v1AssessLevel=assessLevel,v1Summary=notionSummary,v1SaveReview=saveReview;
function defaultSettings(){return {setupCompleted:false,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,shift:{days:[0,1,2,3,4],start:'16:00',end:'02:45'},shabbat:{},fallbacks:{...FALLBACKS},baseline:Object.fromEntries(PIDS.map(k=>[k,{level:null,lastPractice:null}])),trackBaseline:{project:null,uni:null},bodyTargets:{sleep:null,energy:null,weightLow:null,weightHigh:null},financeUrl:''};}
emptyState=()=>({...v1Empty(),schemaVersion:2,settings:{...v1Empty().settings,...defaultSettings()},bodyLog:[],financeImport:null,legacy:{gates:[],levels:[]}});
function ensure(test,message){if(!test)throw Error(message);}

function plannedISO(date,time,zone){if(!/^\d\d:\d\d$/.test(time||''))return null;const [y,m,d]=date.split('-').map(Number),[h,min]=time.split(':').map(Number),want=Date.UTC(y,m-1,d,h,min);let stamp=want;for(let i=0;i<3;i++){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(stamp).map(p=>[p.type,p.value]));const shown=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);stamp+=want-shown;}return new Date(stamp).toISOString();}

submitters['add-priority']=f=>{commit(s=>addPriority(s,week,f.get('text')));toast('Priority added.');};
actions['prev-week']=()=>{week=shiftDate(week,-7);render();};actions['next-week']=()=>{week=shiftDate(week,7);render();};actions['current-week']=()=>{week=weekStart(today());render();};
document.addEventListener('submit',e=>{try{const f=new FormData(e.target);if(e.target.id.startsWith('priority-')){commit(s=>{const p=s.priorities.find(x=>x.id===f.get('id'));if(!f.get('text').trim())throw Error('Enter a priority.');p.text=f.get('text').trim();p.status=f.get('status');});toast('Priority saved.');}if(e.target.id.startsWith('block-')){const b=blocksFor(state,week).find(x=>x.key===f.get('key'));commit(s=>saveBlock(s,b,f.get('status'),f.get('outcome')));toast('Block saved. A block status does not pass a pillar gate.');}}catch(err){toast(err.message,true);}});
views.debrief=()=>{const e=state.entries.find(e=>e.kind==='debrief'&&e.date===today())??{};return `<section class="panel"><h2>Daily debrief · 15:00</h2><p>One weak point. One fix. Saturday: after Shabbat. A debrief alone does not count as a qualifying day.</p><form id="debrief">${field('Date','date',today(),'date')}${notes('One weak point','weak',e.weak,true)}${notes('One fix','fix',e.fix,true)}<details><summary>Optional recovery notes</summary>${field('Sleep hours (0–24)','sleep',e.sleep??'','number')}${field('Energy (1–10)','energy',e.energy??'','number')}</details><button>Save debrief</button></form></section><section class="panel"><h2>Recent debriefs</h2>${state.entries.filter(e=>e.kind==='debrief').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14).map(e=>`<article class="item"><small>${esc(e.date)}</small><p><strong>Weak point:</strong> ${esc(e.weak)}</p><p><strong>Fix:</strong> ${esc(e.fix)}</p></article>`).join('')||'<p>No debriefs yet.</p>'}</section>`;};
titles.debrief='Daily debrief';
submitters.debrief=f=>{commit(s=>saveDebrief(s,Object.fromEntries(f)));toast('Debrief saved. Same-date saves update the existing debrief.');};

function blockChoice(track,date=today()){return `<label>Link scheduled block (optional)<select name="block"><option value="">Unlinked evidence</option>${blocksFor(state,weekStart(date)).filter(b=>b.date===date&&(b.effectiveTrack||b.track)===track).map(b=>`<option value="${esc(b.key)}">${esc(b.title)} · ${esc(b.start)}</option>`).join('')}</select></label>`;}
function practiceBase(track,fallback){return `<input type="hidden" name="track" value="${track}">`+ `${field('Date','date',today(),'date')}<label>Entry type<select name="mode">${options(['practice','fallback'],'practice')}</select></label><p>Fallback: ${esc(fallback)}. Record actual work; a fallback never passes a gate.</p>${notes('Actual work','work','',true)}${blockChoice(track)}`;}
function history(track,missing=()=>[]){return `<section class="panel"><h2>Evidence history</h2>${state.entries.filter(e=>e.kind==='practice'&&e.track===track).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<article class="item"><small>${esc(e.date)} · ${esc(e.mode)}</small><p>${esc(e.work)}</p>${e.result?`<p>Result: ${esc(e.result)}</p>`:''}<p>${missing(e).map(esc).join(' · ')||'Saved evidence; gate assessment is separate.'}</p></article>`).join('')||'<p>No evidence yet.</p>'}</section>`;}
views.strength=()=>`<section class="panel"><h2>Strength</h2><p>The 20-minute slot is a minimum practice appointment, not a complete training prescription. Extend training to match your programme. Do not reconstruct forgotten reps.</p><form id="strength">${practiceBase('strength','5 minutes of recovery or mobility')}<details><summary>Optional evidence</summary>${field('Exercise','exercise')}${notes('Sets: total and clean reps','sets')}${notes('Comparison with another session','comparison')}${notes('Recovery or training notes','recovery')}</details><button>Save Strength evidence</button></form></section>`+history('strength',strengthMissing);
titles.strength='Strength';submitters.strength=f=>{commit(s=>savePractice(s,'strength',Object.fromEntries(f)));toast('Strength saved. Missing evidence remains visible.');};

views.industry=()=>`<section class="panel"><h2>Project / Bootcamp</h2><p>Bootcamp work belongs here. These fixed blocks are a starting schedule, not a cap on career work. Increase them to meet course commitments.</p><form id="project">${practiceBase('project','10 minutes reproducing one behaviour')}${notes('Observed result (optional)','result')}<details><summary>Optional supporting evidence</summary>${field('Artifact or link','artifact')}${notes('Expected behaviour, tests, bugs or help','details')}</details><button>Save project evidence</button></form></section><section class="panel"><h2>University</h2><p>Tuesday 12:30–14:00. During deadline weeks, mark project blocks reallocated on the board; completed linked work stays University work.</p><form id="uni">${practiceBase('uni','10 minutes reviewing the next assignment brief and identifying the next step')}${field('Module (optional)','module')}<label>Submission status<select name="submitted">${options(['unknown','not submitted','submitted','not applicable'],'unknown')}</select></label>${notes('Next step or outcome (optional)','result')}<button>Save University evidence</button></form></section>`+history('project',e=>e.mode==='fallback'?['Fallback does not pass the project gate.']:!e.result?['Missing: observed result']:[])+history('uni',e=>e.mode==='fallback'?['Fallback does not pass the University gate.']:e.submitted==='unknown'?['Missing: submission status']:[]);
titles.industry='Industry';for(const track of ['project','uni'])submitters[track]=f=>{commit(s=>savePractice(s,track,Object.fromEntries(f)));toast('Evidence saved under '+(track==='uni'?'University':'Project / Bootcamp')+'.');};

views.finance=()=>`<section class="panel"><h2>Finance check</h2><p>No balances, amounts, account numbers or identifiers in this trial. Record only what was checked, what remains uncertain and the next decision.</p><form id="finance">${practiceBase('finance','review one outstanding uncertainty and choose the next check')}<label>Check status<select name="checked">${options(['uncertain','checked'],'uncertain')}</select></label>${notes('Decision or next check (optional)','decision')}<button>Save Finance check</button></form></section>`+history('finance',e=>e.mode==='fallback'?['Fallback does not pass the Finance gate.']:[e.checked!=='checked'&&'Missing: completed check',!e.decision&&'Missing: next decision'].filter(Boolean));
titles.finance='Finance';submitters.finance=f=>{commit(s=>savePractice(s,'finance',Object.fromEntries(f)));toast('Finance check saved without amount fields.');};

views.risk=()=>`<section class="panel"><h2>Keep every pillar visible</h2><p>Fallbacks refresh recency, but never replace substantive practice. Missing history means “Baseline needed”, not failure.</p><div class="grid">${Object.entries(tracks).map(([key,label])=>{const r=riskFor(state,key,today());return `<article class="item"><h3>${esc(label)}</h3><strong class="risk-${r.status.toLowerCase().split(' ')[0]}">${esc(r.status)}</strong><p>Last activity: ${esc(r.last||'None recorded')}<br>Last substantive practice: ${esc(r.substantive||'None recorded')}</p><small>Amber after ${r.thresholds[0]} days · red after ${r.thresholds[1]} days</small></article>`;}).join('')}</div></section><section class="panel"><h2>Quick-log a maintenance pillar</h2><form id="maintenance"><label>Pillar<select name="track">${maintenance.map(k=>`<option value="${k}">${esc(tracks[k])}</option>`).join('')}</select></label>${field('Date','date',today(),'date')}<label>Entry type<select name="mode">${options(['practice','fallback'],'practice')}</select></label>${notes('Actual work','work','',true)}<p>Fallbacks: Combat — review one technique cue; Courage — state one small preference; Speech — check one explanation was understood; Politics — read one reliable source; Creativity — write one original detail; Cooking — prepare one simple component; Outdoors/First Aid — recall one safety step and verify it; Responsibility — review one commitment; Dress — sort one item. Record only what you actually did; fallback never passes a gate.</p><button>Save quick log</button></form></section>`;
titles.risk='Risk panel';submitters.maintenance=f=>{const data=Object.fromEntries(f);commit(s=>savePractice(s,data.track,data));toast('Maintenance evidence saved.');};

views.review=()=>{const r=state.reviews.find(r=>r.week===week)||{};return weekPicker()+`<section class="panel"><h2>Saturday night · 30 minutes after Shabbat</h2><p><strong>${qualifyingDays(state,week).length}/7 qualifying days</strong>. A completed block, fallback or completed review counts. Debrief alone does not. Several actions on a day still count once.</p><h3>Priorities</h3>${state.priorities.filter(p=>p.week===week).map(p=>`<p>${esc(p.status)} · ${esc(p.text)}</p>`).join('')||'<p>No priorities selected.</p>'}<h3>Gates</h3>${state.gates.filter(g=>g.week===week).map(g=>`<p>${esc(g.track)} · ${esc(g.status)} · ${esc(g.criteria)}</p>`).join('')||'<p>No gate assessments yet. Assess separately from priorities.</p>'}<form id="review">${field('Review date','date',today(),'date')}${notes('Next week: one adjustment','adjustment',r.adjustment,true)}${field('Weight in kg (optional)','weight',r.weight||'','number')}<button>Save weekly review</button></form></section><section class="panel"><h2>Weekly export</h2><p>Copy this into one dated Notion page. Update that same page when correcting the week. Download the full backup to your external Pillars-Backups folder.</p><textarea aria-label="Notion weekly summary" rows="12" readonly>${esc(notionSummary(state,week))}</textarea><div class="actions"><button data-action="summary-download">Download readable summary</button><button data-action="backup">Download full backup</button></div><p>After checking the Notion copy and downloaded backup for missing or duplicate records:</p><button class="secondary" data-action="export-checked">Mark exports checked</button><p>${r.exportChecked?'Exports checked for this review.':'Exports not yet checked.'}</p><h3>Two-week trial</h3><p>${esc(trialStatus(state).label)}</p>${state.settings.trialStart?`<p>Trial starts ${esc(state.settings.trialStart)}</p>`:'<button data-action="start-trial">Start trial from the next full Sunday week</button>'}<p>Each week needs at least 5 qualifying days, a completed review and checked exports. No new pillar workspace until this passes.</p></section>`;};
titles.review='Weekly review';submitters.review=f=>{commit(s=>saveReview(s,{...Object.fromEntries(f),week}));toast('Review saved. Check the refreshed exports before marking them verified.');};actions['summary-download']=()=>download(`pillars-summary-${week}.md`,notionSummary(state,week),'text/markdown');actions['export-checked']=()=>{checkingExport=true;try{commit(s=>{const r=s.reviews.find(r=>r.week===week);if(!r)throw Error('Save this weekly review first.');r.exportChecked=true;});toast('Export check recorded.');}finally{checkingExport=false;}};

function evidenceChoices(track,w=null,selected=[]){return state.entries.filter(e=>e.kind==='practice'&&e.track===track&&e.mode==='practice'&&(!w||(e.date>=w&&e.date<=shiftDate(w,6)))).map(e=>`<label class="check"><input type="checkbox" name="evidence" value="${esc(e.id)}" ${selected.includes(e.id)?'checked':''}> ${esc(e.date)} · ${esc(e.work)}</label>`).join('')||'<p>No substantive evidence available.</p>';}
views.progress=()=>weekPicker()+`<section class="panel"><h2>Weekly gates</h2><p>Gate evidence, node criteria and overall level are different assessments. A completed block or priority cannot promote any of them.</p>${Object.entries(gateDefaults).map(([track,criteria])=>{const g=state.gates.find(g=>g.week===week&&g.track===track)||{criteria,status:'Unassessed',evidence:[]};return `<form class="item" id="gate-${track}"><h3>${esc(tracks[track])}</h3>${notes('Gate criteria','criteria',g.criteria,true)}<label>Assessment<select name="status">${options(['Unassessed','Met','Partial','Missed'],g.status)}</select></label><p>Missing: ${esc(gateMissing(state,track,week,g.evidence).join('; ')||'No structural gaps; verify full criteria yourself.')}</p><details><summary>Link substantive evidence</summary>${evidenceChoices(track,week,g.evidence)}</details><p>Saving Met confirms you have checked the linked evidence against every part of the gate.</p><button>Save ${esc(tracks[track])} gate</button></form>`;}).join('')}</section><section class="panel"><h2>Node criteria</h2><p>A node is a specific skill criterion from your pillar framework. Add the real criterion; do not infer it from the weekly gate.</p><form id="node"><label>Track<select name="track">${Object.keys(gateDefaults).map(k=>`<option value="${k}">${esc(tracks[k])}</option>`).join('')}</select></label>${notes('Node criterion','criteria','',true)}${notes('Assessment and evidence reference','assessment','',true)}<button>Save node assessment</button></form>${state.nodes.map(n=>`<p>${esc(tracks[n.track])}: ${esc(n.criteria)} — ${esc(n.assessment)}</p>`).join('')}</section><section class="panel"><h2>Levels 1–6 · manual assessment</h2><p>Unassessed until you record a level. Above Functional requires repeated substantive evidence and verification against your actual level criteria.</p>${Object.keys(gateDefaults).map(track=>{const l=state.levels.filter(l=>l.track===track).at(-1);return `<form class="item" id="level-${track}"><h3>${esc(tracks[track])} · ${l?`${l.level} ${levelNames[l.level-1]}`:'Unassessed'}</h3><label>Level<select name="level"><option value="">Choose a level</option>${levelNames.map((n,i)=>`<option value="${i+1}">${i+1} · ${n}</option>`).join('')}</select></label>${notes('Criteria, rationale and verification','rationale','',true)}<details><summary>Link repeated evidence</summary>${evidenceChoices(track)}</details><button>Record ${esc(tracks[track])} level</button></form>`;}).join('')}</section>`;
titles.progress='Gates & levels';for(const track of Object.keys(gateDefaults)){submitters['gate-'+track]=f=>{commit(s=>assessGate(s,{track,week,criteria:f.get('criteria'),status:f.get('status'),evidence:f.getAll('evidence'),confirmed:f.get('status')==='Met'}));toast('Gate assessment saved. Levels unchanged.');};submitters['level-'+track]=f=>{commit(s=>assessLevel(s,{track,level:f.get('level'),rationale:f.get('rationale'),evidence:f.getAll('evidence')}));toast('Manual level assessment recorded.');};}submitters.node=f=>{commit(s=>s.nodes.push({id:id(),date:today(),...Object.fromEntries(f)}));toast('Node assessment saved separately.');};

document.addEventListener('change',e=>{if(e.target.name==='date'&&e.target.form?.elements.track&&e.target.form?.elements.block){const form=e.target.form;form.elements.block.closest('label').outerHTML=blockChoice(form.elements.track.value,e.target.value);}});
actions['start-trial']=()=>{commit(s=>{if(!s.settings.backupFolderConfirmed)throw Error('Confirm your external backup folder on the Backup page first.');const current=weekStart(today());s.settings.trialStart=today()===current?current:shiftDate(current,7);});toast('Two-week trial scheduled. Keep the first week small.');};
// Phase 1 interface. The detailed pillar workspaces remain available during the upgrade.
function pillarName(p){return PILLARS.find(x=>x[0]===p)?.[1]||tracks[p]||p;}
function badge(text,kind=''){return `<span class="badge ${kind||String(text).toLowerCase().replaceAll(' ','-')}">${esc(text)}</span>`;}
function method(...names){return `<div class="mchips">${names.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`;}
function kpi(value,label,detail=''){return `<article class="card kpi c3"><div class="value">${esc(value)}</div><div>${esc(label)}</div><small>${esc(detail)}</small>${label==='Qualifying days'?`<div class="trial-meter" aria-label="${esc(value)} qualifying days; target 5 of 7"><span style="width:${Number(value.split('/')[0])/7*100}%"></span><b></b></div>`:''}</article>`;}
function riskText(r){return r.days===null?'Baseline needed':`${r.days}d · ${r.status}`;}
function gateTotal(w){return state.gates.filter(g=>g.week===w&&g.status==='Met').length;}
function formSelect(label,name,values,selected){return `<label>${esc(label)}<select name="${name}">${options(values,selected)}</select></label>`;}
function timingText(b){return b.startedAt?`${timing(b)} · ${new Intl.DateTimeFormat('en-GB',{timeZone:state.settings.timeZone,hour:'2-digit',minute:'2-digit'}).format(new Date(b.startedAt))}`:'Unknown start';}
function todayBlocks(){return blocksFor(state,weekStart(today())).filter(b=>b.date===today());}
function blockCards(blocks){return blocks.map(b=>`<article class="block-row"><div><b>${esc(b.title)}</b><small>${esc(b.start)}${b.end?'–'+esc(b.end):''} · ${esc(b.status)}${b.status==='reallocated'?' → University · '+esc(b.completion):''}</small><small>${esc(timingText(b))}</small></div><div class="btns">${b.date===today()&&!b.startedAt&&!['done','fallback','missed'].includes(b.completion||b.status)?`<button type="button" data-action="start-block" data-key="${esc(b.key)}">Start now</button>`:''}${b.date<=today()&&b.track!=='review'?`<button type="button" data-action="log-block" data-key="${esc(b.key)}">Log work</button>`:b.track==='review'?'<button data-page="review">Review</button>':''}<button class="secondary" data-action="edit-block" data-key="${esc(b.key)}">Status</button></div></article>`).join('');}
function debriefForm(){const e=state.entries.find(e=>e.kind==='debrief'&&e.date===today())||{};const tags=[...new Set(state.entries.filter(e=>e.kind==='debrief'&&e.weakTag).map(e=>e.weakTag))];return `<form id="debrief"><input type="hidden" name="date" value="${today()}">${notes('One weak point','weak',e.weak,true)}${notes('One fix','fix',e.fix,true)}<label>Tag · optional<input name="weakTag" list="weak-tags" maxlength="40" value="${esc(e.weakTag||'')}"></label><datalist id="weak-tags">${tags.map(t=>`<option value="${esc(t)}">`).join('')}</datalist><details><summary>Sleep, energy & recovery · optional</summary><div class="two">${field('Sleep hours','sleep',e.sleep??'','number')}${field('Energy 1–10','energy',e.energy??'','number')}</div>${formSelect('Recovery','recovery',['','rest','mobility','none'],e.recovery||'')}</details><button>Save debrief</button></form>`;}
function fallbackGrid(){return [...PILLARS].sort((a,b)=>{const x=pillarRisk(state,a[0]),y=pillarRisk(state,b[0]);return (y.days===null?-1:y.days/y.thresholds[1])-(x.days===null?-1:x.days/x.thresholds[1]);}).map(([p,name])=>{const r=pillarRisk(state,p);const track=r.clocks?.find(c=>c.track===r.track)?.track||p;const fallbacks=p==='industry'?['project','uni']:[p];return `<article class="fallback ${r.status.toLowerCase().split(' ')[0]}"><div class="row"><b>${esc(name)}</b>${badge(riskText(r),r.status.toLowerCase().split(' ')[0])}</div>${fallbacks.map(t=>`<p>${p==='industry'?`<strong>${t==='uni'?'University':'Project'}:</strong> `:''}${esc(state.settings.fallbacks[t])}</p><button class="secondary" data-action="fallback" data-track="${t}">Did it · log fallback</button>`).join('')}${r.clocks?`<small>${r.clocks.map(c=>`${c.track==='uni'?'Uni':'Project'}: ${riskText(c)}`).map(esc).join(' · ')}</small>`:''}</article>`;}).join('');}
views.today=()=>{const e=execution(state),blocks=blocksFor(state,weekStart(today())),done=blocks.filter(b=>['done','fallback'].includes(b.completion||b.status)).length,missed=blocks.filter(b=>(b.completion||b.status)==='missed').length,tomorrow=blocksFor(state,weekStart(shiftDate(today(),1))).find(b=>b.date===shiftDate(today(),1));return `${!state.settings.setupCompleted?'<div class="banner c12">Your baselines are not set. Unknown stays unknown. <button data-page="setup">Open Setup</button></div>':''}<section class="card c4"><div class="hd"><h2>Execution</h2><small>Start with the next block</small></div><div class="value">${e.known?e.streak:'—'}</div><p>On-time starts in sequence · unknown starts are skipped</p>${blockCards(todayBlocks())}<p>Tomorrow: ${tomorrow?esc(tomorrow.title+' · '+tomorrow.start):'No scheduled block'}</p><small>${done} done/fallback · ${blocks.filter(b=>b.date>today()||b.date===today()&&b.status==='planned').length} upcoming/planned · ${missed} marked missed</small></section><section class="card c4"><div class="hd"><h2>2-minute debrief</h2><small>${new Date(today()+'T12:00:00').getDay()===6?'After Shabbat':'15:00 daily'}</small></div>${debriefForm()}</section><section class="card c4"><div class="hd"><h2>Recurring weak points</h2><small>Last 14 debriefs</small></div>${repeatingTags(state).map(t=>`<article class="item"><b>×${t.count} · ${esc(t.tag)}</b><p>Latest fix: ${esc(t.fix)}</p>${t.count>=3?badge('Suggest as next adjustment','amber'):''}</article>`).join('')||'<p class="empty">No repeating tags yet. Tags are optional; earlier debriefs stay untagged.</p>'}<p class="muted">A debrief alone does not qualify a trial day.</p></section><section class="card c12"><div class="hd"><h2>Fallbacks · all 12 pillars</h2><small>Actual work keeps continuity; fallback never passes a gate</small></div><div class="fallback-grid">${fallbackGrid()}</div></section>`;};
function pillarWall(){return `<div class="wall" aria-label="Twelve pillar levels and risks">${PILLARS.map(([p,name])=>{const l=levelFor(state,p),r=pillarRisk(state,p),g=gateFor(state,p,week);return `<button class="pillar-col" data-action="pillar-detail" data-pillar="${p}" aria-label="${esc(name)}: ${l?'Level '+l:'Unassessed'}; ${esc(riskText(r))}; gate ${esc(g.status)}"><span class="days ${r.status.toLowerCase().split(' ')[0]}">${r.days===null?'?':r.days+'d'}</span><span class="pillar-bar ${r.status.toLowerCase().split(' ')[0]} ${l?'':'unassessed'}" style="height:${l?l/6*220:48}px;opacity:${r.days===null?1:Math.max(.4,1-r.days/30)}">${l?`<span>${l}</span>`:'?'}</span><span class="gate-symbol" title="${esc(g.status)}">${({Met:'●',Partial:'◐',Missed:'×',Blocked:'⊘','In progress':'◌',Planned:'○'})[g.status]}</span><span class="pillar-label">${esc(name)}</span></button>`;}).join('')}</div><div class="legend"><span>Height: level 1–6</span><span class="current">● Current</span><span class="amber">● Amber</span><span class="red">● Red</span><span>Dashed: unassessed</span><span>Tap or focus for details</span></div><div id="wall-detail" class="wall-detail" aria-live="polite">Select a pillar to see its clocks, level and weekly gate.</div>`;}
function priorityPanel(){const ps=state.priorities.filter(p=>p.week===week);return `<div class="hd"><h2>Priorities</h2><small>At most four · separately scored</small></div>${ps.map(p=>`<form class="item" id="priority-${p.id}"><input type="hidden" name="id" value="${esc(p.id)}">${field('Priority','text',p.text,'text',true)}${formSelect('Status','status',['open','done','partial','deferred'],p.status)}<button class="secondary">Save priority</button></form>`).join('')}${ps.length<4?`<form id="add-priority">${field('Next priority','text','','text',true)}<button>Add priority</button></form>`:''}<h2>Needs attention</h2>${PILLARS.map(([p,n])=>({p,n,r:pillarRisk(state,p)})).filter(x=>['Red','Amber'].includes(x.r.status)).sort((a,b)=>b.r.days/b.r.thresholds[1]-a.r.days/a.r.thresholds[1]).map(({p,n,r})=>`<button class="attention" data-action="pillar-detail" data-pillar="${p}"><b>${esc(n)}</b>${badge(r.status)}<small>${r.days} days · ${r.days>r.thresholds[1]?`${r.days-r.thresholds[1]} days beyond red threshold`:`red after ${r.thresholds[1]} days`}</small></button>`).join('')||'<p>No amber or red pillars. Unknown baselines remain visible on the wall.</p>'}`;}
function scheduleView(){const blocks=blocksFor(state,week),shift=state.settings.shift,shabbat=state.settings.shabbat[week];const minutes=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};const pos=m=>(m-660)/960*100;return `<div class="schedule-scroll"><div class="timeline"><div class="hours">${[11,13,15,17,19,21,23,25,27].map(h=>`<span style="top:${pos(h*60)}%">${String(h%24).padStart(2,'0')}:00</span>`).join('')}</div>${Array.from({length:7},(_,i)=>{const date=shiftDate(week,i);let bands='';if(shift.days.includes(i)){const a=minutes(shift.start),end=minutes(shift.end),b=end<=a?end+1440:end;bands+=`<div class="time-band shift" style="top:${Math.max(0,pos(a))}%;height:${Math.max(0,(Math.min(b,1620)-Math.max(a,660))/960*100)}%">Shift ${esc(shift.start)}–${esc(shift.end)}</div>`;}if(shabbat&&(i===5||i===6)){const a=i===5?minutes(shabbat.start):660,b=i===5?1620:minutes(shabbat.end);bands+=`<div class="time-band shabbat" style="top:${Math.max(0,pos(a))}%;height:${Math.max(0,(b-Math.max(a,660))/960*100)}%">Shabbat</div>`;}let events=blocks.filter(b=>b.date===date).map(b=>{const start=b.track==='review'?shabbat?.end:b.start;if(!start)return `<button class="time-event unscheduled" data-action="edit-block" data-key="${esc(b.key)}">Review · after Shabbat (set time)</button>`;const a=minutes(start),end=b.track==='review'?a+30:minutes(b.end),status=b.completion||b.status;return `<button class="time-event ${status}" style="top:${pos(a)}%;min-height:26px;height:${Math.max(26,(end-a)/960*460)}px" data-action="edit-block" data-key="${esc(b.key)}" aria-label="${esc(b.title+' '+date+' '+start+' '+status)}">${esc(b.title)}<small>${esc(start)} · ${esc(status)}</small></button>`;}).join('');{const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:state.settings.timeZone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p=>[p.type,p.value]));const now=+parts.hour*60+(+parts.minute);const operationalDate=now<180?shiftDate(today(),-1):today();if(date===operationalDate&&(now>=660||now<180))events+=`<div class="now-line" style="top:${pos(now<180?now+1440:now)}%">now</div>`;}return `<div class="timeline-day"><b>${['SUN','MON','TUE','WED','THU','FRI','SAT'][i]} ${date.slice(-2)}</b><div class="day-area">${bands}${events}</div></div>`;}).join('')}</div></div><small>Overnight shifts continue into the following date. Shabbat times are entered per week in Setup.</small>`;}
function heatmap(){const start=shiftDate(week,-77);const q=new Set(Array.from({length:12},(_,i)=>qualifyingDays(state,shiftDate(start,i*7))).flat());const earliest=[...state.entries,...state.blocks,...state.reviews].map(e=>e.date).filter(Boolean).sort()[0];return `<div class="heat">${Array.from({length:84},(_,i)=>{const d=shiftDate(start,i),label=d>today()?'Upcoming':!earliest||d<earliest?'No recorded history':q.has(d)?'Qualifying day':'No qualifying action recorded';return `<button class="heat-cell ${q.has(d)?'qualified':label==='Upcoming'?'upcoming':label==='No recorded history'?'unknown':''}" data-action="chart-detail" data-detail="${esc(d+' · '+label)}" aria-label="${esc(d+' · '+label)}" title="${esc(d+' · '+label)}"></button>`;}).join('')}</div><small>12 weeks · one qualifying day maximum per date · unrecorded history is unknown</small>`;}
function executionChart(){const weeks=Array.from({length:8},(_,i)=>shiftDate(week,(i-7)*7)),colors=['#4fd6a4','#ff6f86','#8391a7','#f2b94f','#b692ff'],labels=['On time','Late','Unknown','Fallback','Missed'];const data=weeks.map(w=>{const c=[0,0,0,0,0];for(const b of state.blocks.filter(b=>b.week===w&&b.date<=today())){const status=b.completion||b.status;if(status==='fallback')c[3]++;else if(status==='missed')c[4]++;else if(status==='done')c[['On time','Late','Unknown'].indexOf(timing(b))]++;}return c;});if(!data.some(c=>c.some(Boolean)))return '<p class="empty">Not enough data yet: needs 1 completed, fallback or missed block.</p>';const max=Math.max(8,...data.map(c=>c.reduce((a,b)=>a+b,0)));return `<svg class="chart" role="img" aria-label="Execution by week, eight weeks" viewBox="0 0 800 190">${[0,4,8].map(n=>`<line x1="30" x2="780" y1="${160-n/max*140}" y2="${160-n/max*140}" stroke="#283245"/><text x="10" y="${164-n/max*140}">${n}</text>`).join('')}${data.map((c,i)=>{let sum=0;return c.map((v,j)=>{const y=160-(sum+v)/max*140;sum+=v;return v?`<rect tabindex="0" role="button" data-action="chart-detail" data-detail="${esc(weeks[i]+' · '+labels[j]+': '+v)}" aria-label="${esc(weeks[i]+' '+labels[j]+' '+v)}" x="${42+i*94}" y="${y}" width="52" height="${Math.max(1,v/max*140-2)}" rx="3" fill="${colors[j]}"><title>${esc(weeks[i]+' · '+labels[j]+': '+v)}</title></rect>`:'';}).join('')+`<text x="${42+i*94}" y="180">${weeks[i].slice(5)}</text>`;}).join('')}</svg><div class="legend">${labels.map((l,i)=>`<span><i style="background:${colors[i]}"></i>${l}</span>`).join('')}</div><small>Each completed block appears once. Fallback and missed are separate from start timing.</small>`;}
views.board=()=>{const ps=state.priorities.filter(p=>p.week===week),ex=execution(state),trial=trialStatus(state);return `<div class="c12">${weekPicker()}</div>${kpi(qualifyingDays(state,week).length+'/7','Qualifying days','Target ≥5 · debrief alone does not count')}${kpi(gateTotal(week)+'/12','Pillar gates Met','One gate per pillar · evidence required')}${kpi(ps.filter(p=>p.status==='done').length+'/'+ps.length,'Priorities done','Maximum four · separate from gates')}${kpi(ex.rate===null?'—':ex.rate+'%','On-time rate · 8 weeks',ex.known+' known starts · '+ex.unknown+' completed starts unknown')}<section class="card c8"><div class="hd"><h2>Pillar wall</h2><small>All 12 · levels, recency & gates</small></div>${pillarWall()}</section><section class="card c4">${priorityPanel()}</section><section class="card c8"><h2>This week · fixed blocks</h2>${scheduleView()}</section><section class="card c4"><h2>Consistency</h2>${heatmap()}<h2>Two-week trial</h2><p>${esc(trial.label)}</p>${(trial.results||[]).map(r=>`<p>${r.week} · ${r.days}/7 · ${r.review?'review & exports checked':'review/export check pending'}</p><progress max="7" value="${r.days}"></progress>`).join('')}<button data-page="review" class="secondary">Open review & trial controls</button></section><section class="card c12"><h2>Execution by week</h2>${executionChart()}<p id="chart-detail" class="muted" aria-live="polite"></p></section>`;};
views.setup=()=>`<section class="card c12"><h2>Your settings & baselines</h2><p>Blank means unknown. Setup never creates practice, passes a gate or changes your historical results.</p><form id="setup"><div class="grid"><section><h3>Schedule</h3>${field('Time zone','timeZone',state.settings.timeZone)}<div class="two">${field('Shift starts','shiftStart',state.settings.shift.start,'time')}${field('Shift ends next day when earlier','shiftEnd',state.settings.shift.end,'time')}</div><div class="checks">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label class="check"><input type="checkbox" name="shiftDays" value="${i}" ${state.settings.shift.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div><h3>Shabbat · selected week ${week}</h3><div class="two">${field('Friday start','shabbatStart',state.settings.shabbat[week]?.start||'','time')}${field('Saturday end','shabbatEnd',state.settings.shabbat[week]?.end||'','time')}</div><p>Both times are optional. Set each week explicitly; no network lookup.</p>${field('Pillar 07 URL · optional','financeUrl',state.settings.financeUrl,'url')}</section><section><h3>Body targets · enter your confirmed values</h3>${field('Average sleep target (hours)','targetSleep',state.settings.bodyTargets.sleep??'','number')}${field('Average energy target (1–10)','targetEnergy',state.settings.bodyTargets.energy??'','number')}<div class="two">${field('Weight target lower (kg)','targetLow',state.settings.bodyTargets.weightLow??'','number')}${field('Weight target upper (kg)','targetHigh',state.settings.bodyTargets.weightHigh??'','number')}</div><p>These are your targets; no personal values are prefilled.</p></section></div><h3>All 12 pillar baselines</h3><div class="baseline-grid">${PILLARS.map(([p,n])=>`<fieldset><legend>${esc(n)}</legend><label>Baseline level<select name="level-${p}"><option value="">Unassessed</option>${levelNames.map((n,i)=>`<option value="${i+1}" ${state.settings.baseline[p].level===i+1?'selected':''}>${i+1} · ${n}</option>`).join('')}</select></label>${p==='industry'?['project','uni'].map(t=>field((t==='uni'?'University':'Project')+' last practice','last-'+t,state.settings.trackBaseline[t]||'','date')).join(''):field('Last known practice','last-'+p,state.settings.baseline[p].lastPractice||'','date')}</fieldset>`).join('')}</div><h3>Pre-decided fallbacks</h3><div class="grid">${Object.entries(FALLBACKS).map(([p])=>field(pillarName(p)+' fallback','fallback-'+p,state.settings.fallbacks[p])).join('')}</div><button>Save Setup</button></form></section><section class="card c12"><h2>Add a dated baseline weight</h2><p>Use a date you actually know. If a baseline is only known by month, leave it out of the dated chart until its date is confirmed.</p><form id="baseline-weight"><div class="two">${field('Measurement date','date','','date',true)}${field('Weight (kg)','value','','number',true)}</div>${formSelect('Accuracy','accuracy',['exact','approximate'],'exact')}<button>Add baseline weight</button></form>${state.bodyLog.map(r=>`<p>${esc(r.date)} · ${r.value} kg · ${esc(r.accuracy)}</p>`).join('')}</section>`;
submitters.setup=f=>{commit(s=>{const set=s.settings,num=k=>f.get(k)===''?null:Number(f.get(k));set.timeZone=f.get('timeZone');set.shift={days:f.getAll('shiftDays').map(Number),start:f.get('shiftStart'),end:f.get('shiftEnd')};const a=f.get('shabbatStart'),b=f.get('shabbatEnd');ensure((!a&&!b)||(a&&b),'Enter both Shabbat times or leave both blank.');if(a)set.shabbat[week]={start:a,end:b};else delete set.shabbat[week];set.financeUrl=f.get('financeUrl').trim();set.bodyTargets={sleep:num('targetSleep'),energy:num('targetEnergy'),weightLow:num('targetLow'),weightHigh:num('targetHigh')};for(const [p] of PILLARS){set.baseline[p].level=num('level-'+p);if(p!=='industry'){const d=f.get('last-'+p)||null;ensure(!d||d<=today(),'Baseline dates cannot be in the future.');set.baseline[p].lastPractice=d;}}for(const t of ['project','uni']){const d=f.get('last-'+t)||null;ensure(!d||d<=today(),'Baseline dates cannot be in the future.');set.trackBaseline[t]=d;}for(const k of Object.keys(FALLBACKS))set.fallbacks[k]=f.get('fallback-'+k).trim();set.setupCompleted=true;});toast('Setup saved. Baselines remain separate from evidence.');};
submitters['baseline-weight']=f=>{commit(s=>{const date=f.get('date');ensure(validDate(date)&&date<=today(),'Choose a known date, today or earlier.');s.bodyLog.push({id:id(),date,kind:'weight',value:Number(f.get('value')),accuracy:f.get('accuracy'),source:'baseline'});});toast('Dated baseline saved.');};
views.body=()=>`<section class="card c12"><h2>Body · detailed charts arrive in Phase 2</h2><p>Your sleep and energy remain in daily debriefs. Targets and dated baseline weights can be entered in Setup now.</p><button data-page="setup">Open Setup</button><h3>Recent recovery records</h3>${state.entries.filter(e=>e.kind==='debrief').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14).map(e=>`<p>${esc(e.date)} · sleep ${e.sleep??'unknown'} h · energy ${e.energy??'unknown'} · ${esc(e.recovery||'recovery unrecorded')}</p>`).join('')||'<p>Not enough data yet: needs 1 debrief with recovery information.</p>'}</section>`;
views.progress=()=>`<div class="c12">${weekPicker()}</div><section class="card c12"><h2>Twelve weekly gates</h2><p>Met means you demonstrated the agreed advancement. Logging activity alone does not pass a gate.</p><div class="gate-grid">${PILLARS.map(([p,n])=>{const g=gateFor(state,p,week),ev=state.entries.filter(e=>e.kind==='practice'&&e.mode==='practice'&&(p==='industry'?['project','uni'].includes(e.track):e.track===p)&&e.date>=week&&e.date<=shiftDate(week,6));return `<form class="item" id="v2-gate-${p}"><h3>${esc(n)}</h3>${notes('Advancement target','criteria',g.criteria,true)}${formSelect('Gate status','status',GATE_STATUSES,g.status)}${p==='industry'?`<label>Required track checks<select name="requiredTracks"><option value="project" ${g.requiredTracks?.join(',')==='project'?'selected':''}>Project</option><option value="uni" ${g.requiredTracks?.join(',')==='uni'?'selected':''}>University</option><option value="project,uni" ${g.requiredTracks?.length===2?'selected':''}>Both tracks</option></select></label>`:''}<details><summary>Evidence & result</summary>${ev.map(e=>`<label class="check"><input type="checkbox" name="evidence" value="${esc(e.id)}" ${g.evidence.includes(e.id)?'checked':''}>${esc(e.date+' · '+e.work)}</label>`).join('')||'<p>No substantive evidence this week.</p>'}${notes('Observed result','result',g.result)}</details><p class="missing">${esc(gateMissing(state,p,week,g.evidence,g.requiredTracks).join(' · ')||'Structural evidence present; verify the full target.')}</p><small>Saving Met confirms that the linked evidence demonstrates every part of this target.</small><button>Save ${esc(n)} gate</button></form>`;}).join('')}</div></section><section class="card c12"><h2>Manual levels & node assessments</h2><p>Weekly gates do not promote levels. Notion remains your detailed mastery register; record an assessment with its rationale here.</p><form id="v2-level"><label>Pillar<select name="track">${PILLARS.map(([p,n])=>`<option value="${p}">${esc(n)}</option>`).join('')}</select></label><label>Level<select name="level">${levelNames.map((n,i)=>`<option value="${i+1}">${i+1} · ${n}</option>`).join('')}</select></label>${notes('Criteria and rationale','rationale','',true)}<details><summary>Link substantive evidence for this pillar</summary>${state.entries.filter(e=>e.kind==='practice'&&e.mode==='practice').map(e=>`<label class="check"><input type="checkbox" name="evidence" value="${esc(e.id)}">${esc(e.date+' · '+pillarName(e.track)+' · '+e.work)}</label>`).join('')||'<p>No evidence yet.</p>'}</details><button>Record manual level</button></form><form id="node"><label>Pillar<select name="track">${PILLARS.map(([p,n])=>`<option value="${p}">${esc(n)}</option>`).join('')}</select></label>${notes('Node criterion','criteria','',true)}${notes('Assessment and evidence reference','assessment','',true)}<button>Save node assessment</button></form><details><summary>Preserved legacy assessments</summary><p>${state.legacy.gates.length} gates and ${state.legacy.levels.length} level assessments preserved.</p>${[...state.legacy.gates,...state.legacy.levels].map(r=>`<p>${esc(r.week||r.date)} · ${esc(r.track)} · ${esc(r.status||levelNames[r.level-1])}</p>`).join('')}</details></section>`;
for(const [p] of PILLARS)submitters['v2-gate-'+p]=f=>{commit(s=>assessGate(s,{track:p,week,criteria:f.get('criteria'),status:f.get('status'),evidence:f.getAll('evidence'),confirmed:f.get('status')==='Met',result:f.get('result'),requiredTracks:(f.get('requiredTracks')||'project').split(',')}));toast('Gate saved separately from priorities and levels.');};
submitters['v2-level']=f=>{commit(s=>assessLevel(s,{...Object.fromEntries(f),evidence:f.getAll('evidence')}));toast('Manual assessment saved.');};
const oldReview=views.review;views.review=()=>`<div class="phase-note">The full Review redesign arrives in Phase 3. Existing review and export controls remain available. <button data-page="progress">Assess all 12 gates</button></div>`+`<section class="panel"><h2>All twelve gates · ${gateTotal(week)}/12 Met</h2><div class="gate-grid">${PILLARS.map(([p,n])=>`<div class="item"><b>${esc(n)}</b> ${badge(gateFor(state,p,week).status)}</div>`).join('')}</div></section>`+oldReview();
actions['export-checked']=()=>{checkingExport=true;try{commit(s=>{const r=s.reviews.find(r=>r.week===week);ensure(r,'Save the review first.');r.exportChecked=true;r.checkedSummary=notionSummary(s,week);});toast('Exports checked for this exact weekly summary.');}finally{checkingExport=false;}};
commit=fn=>{ensure(!loadError&&!migrationRaw,'Complete the upgrade or restore a valid backup before editing.');const before=state,draft=structuredClone(state);fn(draft);if(!checkingExport)invalidateChangedExports(before,draft);state=store.save(draft,state.revision);render();};
function openDialog(html,label='Log evidence'){const d=$('#drawer');d.innerHTML=`<header><h2>${esc(label)}</h2><button type="button" class="secondary" data-action="close-dialog" aria-label="Close dialog">Esc</button></header>${html}`;d.showModal();}
function logDrawer(track='strength',mode='practice',key=''){const b=key?[...blocksFor(state,week),...blocksFor(state,weekStart(today()))].find(b=>b.key===key):null;const date=b?.date||today();openDialog(`<form id="quick-log"><div class="chips" aria-label="Choose pillar">${PILLARS.map(([p,n])=>`<button type="button" class="chip ${p===(track==='project'||track==='uni'?'industry':track)?'on':''}" data-action="choose-pillar" data-pillar="${p}">${esc(n)}</button>`).join('')}</div><label>Pillar / track<select name="track" id="quick-track">${PILLARS.flatMap(([p,n])=>p==='industry'?[['project','Industry · Project / Bootcamp'],['uni','Industry · University']]:[[p,n]]).map(([p,n])=>`<option value="${p}" ${p===track?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${formSelect('Entry type','mode',['practice','fallback'],mode)}${field('Date','date',date,'date')}${notes('What you actually did','work','',true)}<p id="quick-fallback">Fallback: ${esc(state.settings.fallbacks[track])}</p><div id="quick-fields">${quickFields(track,date,key)}</div><button>Save evidence</button><p>Linking a completed block qualifies the date; any actual fallback also qualifies. An unlinked practice is evidence without a scheduled-block completion.</p></form>`);}
function quickFields(track,date,key=''){let choices=blocksFor(state,weekStart(date)).filter(b=>b.date===date&&(b.effectiveTrack||b.track)===track);return `<label>Link scheduled block · optional<select name="block"><option value="">Unlinked evidence</option>${choices.map(b=>`<option value="${esc(b.key)}" ${b.key===key?'selected':''}>${esc(b.title+' · '+b.start)}</option>`).join('')}</select></label><details><summary>Additional evidence · optional</summary>${track==='strength'?field('Sets · clean/total, e.g. 3/4, 2/3','sets')+notes('Compare sessions','comparison'):track==='project'?notes('Observed result','result')+field('Artifact or link','artifact'):track==='uni'?field('Module','module')+formSelect('Submission status','submitted',['unknown','not submitted','submitted','not applicable'],'unknown')+notes('Next step or result','result'):track==='finance'?formSelect('Check status','checked',['uncertain','checked'],'uncertain')+notes('Decision','decision'):''}</details>`;}
submitters['quick-log']=f=>{const row=Object.fromEntries(f);commit(s=>savePractice(s,row.track,row));toast('Evidence saved. Gates remain separately assessed.');};
actions['choose-pillar']=el=>{const select=$('#quick-track');select.value=el.dataset.pillar==='industry'?'project':el.dataset.pillar;select.dispatchEvent(new Event('change',{bubbles:true}));};
actions.log=()=>logDrawer();actions.fallback=el=>logDrawer(el.dataset.track,'fallback');actions['log-block']=el=>{const b=blocksFor(state,week).find(b=>b.key===el.dataset.key)||blocksFor(state,weekStart(today())).find(b=>b.key===el.dataset.key);logDrawer(b.effectiveTrack||b.track,'practice',b.key);};
actions['start-block']=el=>{commit(s=>startBlock(s,el.dataset.key));toast('Actual start recorded; completion is still separate.');};
actions['close-dialog']=()=>$('#drawer').close();
actions['edit-block']=el=>{const w=el.dataset.key.split(':')[0],b=blocksFor(state,w).find(b=>b.key===el.dataset.key);openDialog(`<form id="edit-block"><input type="hidden" name="key" value="${esc(b.key)}"><p>${esc(b.date+' · '+b.start+' · '+b.title)}</p>${formSelect('Status','status',['planned','done','fallback',...(b.track==='project'?['reallocated']:[]),'missed'],b.status)}${notes('Actual work or reason','outcome',b.outcome)}<p>${esc(timingText(b))}. Saving status does not invent a start time.</p><button>Save block status</button></form>`,'Block status');};
submitters['edit-block']=f=>{const key=f.get('key'),w=key.split(':')[0],b=blocksFor(state,w).find(b=>b.key===key);commit(s=>saveBlock(s,b,f.get('status'),f.get('outcome')));toast('Block status saved.');};
function showPillar(p){const r=pillarRisk(state,p),g=gateFor(state,p,week),level=levelFor(state,p);$('#wall-detail').innerHTML=`<b>${esc(pillarName(p))}</b> · ${level?'Level '+level+' '+levelNames[level-1]:'Level unassessed'} · Gate: ${esc(g.status)}<p>${r.clocks?r.clocks.map(c=>`${c.track==='uni'?'University':'Project'}: ${riskText(c)}; last substantive practice ${c.substantive||'not recorded'}`).map(esc).join('<br>'):esc(riskText(r)+'; last substantive practice '+(r.substantive||'not recorded'))}</p><p>${esc(g.criteria)}</p><button data-page="progress">Assess gate</button>`;}
actions['pillar-detail']=el=>showPillar(el.dataset.pillar);actions['chart-detail']=el=>{const target=$('#chart-detail');if(target)target.textContent=el.dataset.detail;else toast(el.dataset.detail);};
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-pillar]');if(el&&$('#wall-detail'))showPillar(el.dataset.pillar);if(e.target.dataset?.action==='chart-detail')actions['chart-detail'](e.target);});
document.addEventListener('mouseover',e=>{const el=e.target.closest('.pillar-col');if(el&&$('#wall-detail'))showPillar(el.dataset.pillar);});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='l'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.closest('input,textarea,select,[contenteditable]')&&!migrationRaw){e.preventDefault();logDrawer();}if((e.key==='Enter'||e.key===' ')&&e.target.tagName.toLowerCase()==='rect'&&e.target.dataset.action==='chart-detail'){e.preventDefault();actions['chart-detail'](e.target);}});
document.addEventListener('change',e=>{if(e.target.form?.id==='quick-log'&&['track','date'].includes(e.target.name)){const f=e.target.form;document.querySelectorAll('.chips [data-pillar]').forEach(b=>b.classList.toggle('on',b.dataset.pillar===(['project','uni'].includes(f.elements.track.value)?'industry':f.elements.track.value)));$('#quick-fields').innerHTML=quickFields(f.elements.track.value,f.elements.date.value);$('#quick-fallback').textContent='Fallback: '+state.settings.fallbacks[f.elements.track.value];}});
views.migration=()=>`<section class="card c12"><h2>Protect your v1 records before upgrading</h2><p>Your existing browser records have not been changed. First download the complete v1 backup and save it outside the repository.</p><button data-action="download-v1">1 · Download untouched v1 backup</button><label class="check"><input id="migration-confirm" type="checkbox">I have saved that downloaded file in my external Pillars-Backups folder</label><button data-action="migrate-v2" ${migrationDownload?'':'disabled'}>2 · Verify & upgrade this browser</button><p>A second untouched copy is kept in this browser. If validation or copying fails, v1 stays active and untouched.</p></section>`;
actions['download-v1']=()=>{download(`pillars-backup-v1-${today()}-${Date.now()}.json`,JSON.stringify({format:'pillars-backup',exportedAt:new Date().toISOString(),data:JSON.parse(migrationRaw)},null,2));migrationDownload=true;render();toast('Save the file outside the repository, then confirm below.');};
actions['migrate-v2']=()=>{ensure($('#migration-confirm').checked,'Confirm the downloaded file is saved outside the repository.');state=store.migrate(migrationRaw,true);migrationRaw=null;loadError=null;page='today';render();toast('Upgrade verified. Your original v1 copy is preserved.');};
const phaseTitles={today:'Today',board:'Week',strength:'Strength',industry:'Industry',finance:'Finance',body:'Body',review:'Review',backup:'Backup',setup:'Setup',progress:'Gates & levels',migration:'Upgrade safely'};
Object.assign(titles,phaseTitles);
render=()=>{document.querySelector('details.menu').open=false;const active=migrationRaw?'migration':page;if(!views[active])page='today';$('#nav').innerHTML=['today','board','strength','industry','finance','body','review'].map(k=>`<button data-page="${k}" aria-current="${active===k?'page':'false'}" ${migrationRaw?'disabled':''}>${titles[k]}</button>`).join('');$('#intro').innerHTML=`<div><h1>${esc(titles[active])}${active==='today'?' · '+esc(today()):''}</h1><p>${active==='today'?'Choose the next action. Keep an honest record.':active==='board'?'Twelve pillars. Four priorities at most.':''}</p>${active==='today'?method('KOBE · EXECUTION','LAUDA · DEBRIEF','MANNING · FALLBACK'):active==='board'?method('KOBE · EXECUTION','DIMON · RISK'):active==='review'?method('HUANG · WEEKLY REVIEW'):active==='body'?method('BRADY · BODY'):active==='strength'?method('KOBE · EXECUTION','MANNING · FALLBACK'):active==='industry'?method('KOBE · EXECUTION','DIMON · RISK'):active==='finance'?method('DIMON · RISK'):''}</div><small class="local-note">ON THIS DEVICE<br>Phase 1 preview</small>`;$('#content').className=['today','board','setup','progress','body','migration'].includes(active)?'view-grid':'legacy-view';$('#content').innerHTML=views[active]();$('#drawer')?.remove();const d=document.createElement('dialog');d.id='drawer';d.setAttribute('aria-label','Pillars entry');document.body.append(d);if(loadError&&!migrationRaw)toast(loadError,true);};
page=migrationRaw?'migration':'today';
render();
</script></body></html>
