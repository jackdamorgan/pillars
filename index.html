views.route=()=>{const r=routeRecord(state,routeEditorId),missing=routeMissing(state,r),nodes=skillNodes(state,r.pillar),status=routeState(state,r);const steps=['Change','Skill & improvement','Evidence','Challenge 1','Challenge 2','Assessment'];let form='';
 if(routeStep===0)form=notes('What did you advance instead?','to',r.to)+notes('Why did you change the route?','reason',r.reason)+`<label>Original planned skill · optional (helps spot repeated swaps)<select name="plannedSkillId"><option value="">Use the original gate wording</option>${nodes.map(n=>`<option value="${esc(n.id)}" ${r.plannedSkillId===n.id?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label>`;
 if(routeStep===1)form=`<label>Skill step demonstrated<select name="nodeId"><option value="">Describe a different step below</option>${nodes.map(n=>`<option value="${esc(n.id)}" ${r.skill?.nodeId===n.id?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label>${notes('Or describe the skill step and the criteria it demonstrates','customSkill',r.skill&&!r.skill.nodeId?r.skill.criteria:'')}${r.skill?.baseline?`<p class="source-prose"><strong>Recorded baseline:</strong> ${esc(r.skill.baseline)}</p>`:''}${notes('What improved compared with the baseline?','improvement',r.improvement)}`;
 if(routeStep===2)form=evidenceSelect('evidence',r.evidence,r.week)+`<p>Choose logged work from this week. Minimum alternatives remain continuity only. Financial imports and historical records cannot be used here.</p><button type="button" data-action="pillar-log" data-pillar="${r.pillar}">Log an activity first</button>`;
 if(routeStep===3)form=routeSelect('Easier than planned?','easier',[['yes','Yes'],['no','No']],r.checks.easier)+routeSelect('Same skill, or a related one?','relation',[['same','Same skill'],['related','Related skill']],r.checks.relation);
 if(routeStep===4)form=routeSelect('Would it meet the original criteria?','originalCriteria',[['yes','Yes'],['no','No']],r.checks.originalCriteria)+routeSelect('Avoiding the planned task?','avoidance',[['yes','Yes'],['no','No']],r.checks.avoidance);
 if(routeStep===5)form=`<h3>Chosen criteria</h3><p>${esc(r.skill?.criteria||'Missing')}</p><p><strong>Improvement:</strong> ${esc(r.improvement||'Missing')}</p><p><strong>Checks:</strong> ${esc('Easier: '+(r.checks.easier||'unknown')+' · skill: '+(r.checks.relation||'unknown')+' · original criteria: '+(r.checks.originalCriteria||'unknown')+' · avoidance: '+(r.checks.avoidance||'unknown'))}</p>${status===ROUTE_READY||status==='Met'?`${notes('Explain how this evidence meets the chosen skill criteria','result',r.result,true)}<label class="check"><input name="confirmed" type="checkbox" required> I checked the evidence against those criteria and confirm the advancement.</label><button>Assess Met · route changed</button>`:`<p>${status===ROUTE_CONTINUITY?'Continuity only: easier work, avoidance or a minimum alternative cannot pass the gate or advance a level.':'Complete all clarification and check answers before assessment.'}</p>`}`;
 return `<section class="card c12"><button data-page="${pillarPage(r.pillar)}">Back to ${esc(pillarName(r.pillar))}</button><h2>I advanced this differently · ${r.week}</h2>${badge(status)}<p><strong>Original plan:</strong> ${esc(r.from)}</p><div class="route-steps">${steps.map((t,i)=>`<button class="secondary" data-action="route-step" data-step="${i}" aria-current="${i===routeStep?'step':'false'}">${i+1}. ${t}</button>`).join('')}</div><form id="${routeStep===5?'route-assess':'route-save'}"><input type="hidden" name="routeId" value="${esc(r.id)}"><input type="hidden" name="step" value="${routeStep}">${form}${routeStep<5?'<button>Save draft & continue</button>':''}</form>${missing.length?`<p class="missing">Still needed: ${esc(missing.join(' · '))}</p>`:''}<p>Incomplete answers are saved as Pending clarification and give no credit. Each change preserves the previous answers.</p><details><summary>Original plan & answer history · ${r.history.length} saved versions</summary><p>${esc(r.plannedGate.criteria)} · original status ${esc(r.plannedGate.status)}</p>${r.history.map(h=>`<article class="evi"><small>${esc(h.savedAt)}</small><p>${esc(h.to||'Pending')} · ${esc(h.status)}</p><p>Reason: ${esc(h.reason)} · Skill: ${esc(h.skill?.criteria||'Missing')} · Improvement: ${esc(h.improvement)}</p><p>Evidence: ${esc(h.evidence.join(', '))}</p><p>Checks: ${esc(JSON.stringify(h.checks))}</p><p>Outcome: ${esc(h.result)}</p></article>`).join('')}</details></section>`;
};titles.route='Changed route';
submitters['route-save']=f=>{const step=Number(f.get('step')),patch=step===0?{to:f.get('to'),reason:f.get('reason'),plannedSkillId:f.get('plannedSkillId')}:step===1?{skill:f.get('nodeId')?{nodeId:f.get('nodeId')}:{name:f.get('customSkill'),criteria:f.get('customSkill')},improvement:f.get('improvement')}:step===2?{evidence:f.get('evidence')?[f.get('evidence')]:[]}:step===3?{checks:{easier:f.get('easier'),relation:f.get('relation')}}:{checks:{originalCriteria:f.get('originalCriteria'),avoidance:f.get('avoidance')}};commit(s=>saveRoute(s,f.get('routeId'),patch));routeStep=Math.min(5,step+1);render();toast('Answers saved. No automatic gate or level pass.');};
submitters['route-assess']=f=>{commit(s=>assessRoute(s,f.get('routeId'),f.get('result'),f.get('confirmed')==='on'));toast('Gate manually assessed Met · route changed. Level unchanged.');};
actions['pillar-gate']=el=>{const p=el.dataset.pillar,g=gateFor(state,p,week);if(g.routeId){routeEditorId=g.routeId;routeStep=5;page='route';render();return;}openDialog(`<form id="v2-gate-${p}">${notes('Advancement target','criteria',g.criteria,true)}${formSelect('Gate status','status',GATE_STATUSES,g.status)}${p==='industry'?formSelect('Required track checks','requiredTracks',['project','uni','project,uni'],g.requiredTracks.join(',')):''}<h3>Evidence</h3>${activityOptions(p,week).filter(e=>(routePillar(e.track)===p||linkedSkillEvidence(state,p,e.id))&&eligibleActivity(state,e)).map(e=>`<label class="check"><input type="checkbox" name="evidence" value="${esc(e.id)}" ${g.evidence.includes(e.id)?'checked':''}>${esc(e.date+' · '+e.work)}</label>`).join('')}${notes('Observed result','result',g.result)}<p>Saving Met confirms every part of the target. Missing evidence prevents a pass.</p><button>Save gate</button></form><p>${routeButton(p)}</p>`,'Assess '+pillarName(p));};
actions['pillar-level']=el=>{const p=el.dataset.pillar;openDialog(`<form id="v2-level"><input type="hidden" name="track" value="${p}">${formSelect('Level','level',[1,2,3,4,5,6].map(String),String(levelFor(state,p)||1))}${notes('Criteria and rationale','rationale','',true)}<label>Evidence<select name="evidence" required><option value="">Choose activity</option>${activityOptions().filter(e=>(routePillar(e.track)===p||linkedSkillEvidence(state,p,e.id))&&eligibleActivity(state,e)).map(e=>`<option value="${esc(e.id)}">${esc(e.date+' · '+e.work)}</option>`).join('')}</select></label><details><summary>Additional dated evidence for levels above 3</summary>${activityOptions().filter(e=>(routePillar(e.track)===p||linkedSkillEvidence(state,p,e.id))&&eligibleActivity(state,e)).map(e=>`<label class="check"><input name="evidence" type="checkbox" value="${esc(e.id)}">${esc(e.date+' · '+e.work)}</label>`).join('')}</details><button>Save manual level assessment</button></form>`,'Assess overall '+pillarName(p)+' level');};
actions['assess-skill']=el=>{const p=el.dataset.pillar,n=skillNodes(state,p).find(n=>n.id===el.dataset.node);openDialog(`<form id="skill-assess"><input type="hidden" name="pillar" value="${p}"><input type="hidden" name="nodeId" value="${esc(n.id)}"><p class="source-prose">${esc(n.criteria)}</p>${evidenceSelect('evidence',[])}${notes('Explain how the activity demonstrates these criteria','assessment','',true)}<label class="check"><input type="checkbox" name="confirmed" required> I checked the evidence against this node’s criteria.</label><button>Save skill assessment</button></form>`,'Assess '+n.name);};
submitters['skill-assess']=f=>{commit(s=>assessSkill(s,f.get('pillar'),f.get('nodeId'),f.get('evidence')?[f.get('evidence')]:[],f.get('assessment'),f.get('confirmed')==='on'));toast('Skill assessment saved. Overall level unchanged.');};
actions['add-skill']=el=>openDialog(`<form id="node"><input type="hidden" name="track" value="${el.dataset.pillar}">${notes('Skill step and its criteria','criteria','',true)}${notes('Current baseline or unknown','assessment','',true)}<button>Save node description</button></form>`,'Describe a skill node');
const beforeRouteReviewView=views.review;views.review=()=>beforeRouteReviewView()+`<section class="card c12"><h2>Changed routes this week</h2>${routeCards()}</section>`;
const beforeRouteShowPillar=showPillar;showPillar=p=>{beforeRouteShowPillar(p);$('#wall-detail').insertAdjacentHTML('beforeend',`<button data-page="${pillarPage(p)}">Open ${esc(pillarName(p))}</button>`);};
const beforeRouteProgressView=views.progress;views.progress=()=>`<section class="card c12"><h2>Alternative routes</h2><p>Keep the original plan and assess different progress explicitly.</p><div class="pillar-links">${PILLARS.map(([p,n])=>`<button data-page="${pillarPage(p)}">${esc(n)}</button>`).join('')}</div></section>`+beforeRouteProgressView();
const beforeRouteRender=render;render=()=>{beforeRouteRender();if(migrationRaw)return;if(page==='progress')for(const [p] of PILLARS){const form=document.getElementById('v2-gate-'+p);if(form)form.insertAdjacentHTML('beforeend',routeButton(p));}const nav=$('#nav');nav.insertAdjacentHTML('afterbegin','<button data-page="pillars" aria-current="'+(page==='pillars'?'page':'false')+'">Pillars</button>');const menu=$('details.menu > div');if(menu&&!menu.querySelector('[data-page="pillars"]'))menu.insertAdjacentHTML('afterbegin','<button data-page="pillars">All 12 pillars</button>');if(page==='pillars'||page==='route'||page.startsWith('pillar-'))$('#content').className='view-grid';const note=$('.local-note');if(note)note.innerHTML='ON THIS DEVICE<br>All pillars & flexible progress · v2.4';};

function notionBaselinePanel(p){const n=state.notionHistory?.snapshot.normalized;if(!n)return '<p>Import your Notion history to show its skill baselines here. <button data-page="history">Notion history</button></p>';const b=n.pillars.find(x=>x.id===p),repair=notionBaselineRepair(state);return `<details><summary>Notion baseline status</summary><p>Snapshot: ${esc(state.notionHistory.snapshot.retrievedOn)}. This is imported history, not live sync.</p><p>${esc(b?.levelReason||'Only explicit overall levels are used; skill levels stay separate.')}</p>${(p==='industry'?['project','uni']:[p]).map(t=>`<p>${esc(tracks[t]||pillarName(t))}: last confirmed baseline ${esc((['project','uni'].includes(t)?state.settings.trackBaseline[t]:state.settings.baseline[t]?.lastPractice)||'Unknown')}</p>`).join('')}${repair.changes.length?`<p>Empty fields can be filled from confirmed Notion data: ${esc(repair.changes.join(' · '))}</p><button data-action="repair-notion-baselines">Restore missing confirmed baselines</button>`:'<p>No missing confirmed baseline fields to restore. Unknown values have not been inferred.</p>'}</details>`;}
const sharedWithBaselines=sharedPillar;sharedPillar=p=>sharedWithBaselines(p)+`<section class="card c12">${notionBaselinePanel(p)}</section>`;
actions['repair-notion-baselines']=()=>{const repaired=notionBaselineRepair(state);ensure(repaired.changes.length,'No missing confirmed fields to restore.');download(`pillars-backup-before-baseline-repair-${today()}-${Date.now()}.json`,encodeBackup(state));commit(s=>Object.assign(s,repaired.state));toast('Confirmed missing baseline fields restored. Existing choices and skill levels preserved.');};
function baselineReportView(report){return `<div class="phase2-evidence">${report.map(r=>{const b=state.settings.baseline[r.pillar],a=r.latest,provenance=state.settings.notionBaselines?.[r.pillar];return `<article class="evi"><b>${esc(r.name)}</b><p>${a?'Latest recorded activity: '+esc(a.sourceRecordedDate):esc(r.reason)}</p>${a?`<p>${esc(a.title)} · mapped by ${esc(a.mapping)}</p>${notionLink(a.sourceUrl,'Open dated activity')}`:''}<p>Saved recency baseline: ${esc(b.lastPractice||'Unknown')}${b.lastPractice?' · existing non-empty dates are preserved':''}</p>${provenance?.sourceUrl?notionLink(provenance.sourceUrl,'Open baseline source'):''}</article>`;}).join('')}</div>`;}
notionBaselinePanel=p=>{const n=state.notionHistory?.snapshot.normalized;if(!n)return '<p>Import Notion history to show its baseline. <button data-page="history">Notion history</button></p>';const report=notionActivityReport(state.notionHistory.snapshot).filter(r=>r.pillar===p);return `<details><summary>Notion baseline status</summary><p>Recorded dates feed recency only. They may be reporting dates; original notes are preserved. No trial days, gates or levels are awarded.</p>${baselineReportView(report)}${p==='industry'?'<p>Industry activity does not establish a University or Project date. Their separate clocks retain only specifically recorded track evidence.</p>':''}<button data-page="notion-refresh">Refresh Notion history</button></details>`;};
const historyBeforeRefresh=views.history;
views.history=()=>`<section class="card"><h2>Notion recency baselines</h2><p>Dates come from gate-linked activities first, then skill Pillars tags. Only empty baseline dates are filled.</p><button data-page="notion-refresh">Refresh Notion history</button>${state.notionHistory?`<details><summary>All 12 baseline dates and missing-data reasons</summary>${baselineReportView(notionActivityReport(state.notionHistory.snapshot))}</details>`:''}</section>`+historyBeforeRefresh().replace('This is a one-time import, not a live connection.', 'You can refresh this snapshot from a newer history file; this is not a live connection.');
let refreshPreview=null;
titles['notion-refresh']='Refresh Notion history';
views['notion-refresh']=()=>`<section class="card c12"><h2>Refresh Notion history</h2><p>Choose a refreshed private Notion history file. This remains a manual snapshot refresh; the public site has no Notion credentials or live connection.</p><p>Preview first saves and verifies a recovery copy, and downloads your current backup. Confirming merges by Notion source ID; it never duplicates records or overwrites your local gate assessments and priorities.</p><label>Refreshed Notion history file<input id="notion-refresh-file" type="file" accept="application/json,.json"></label><details><summary>Or paste refreshed file contents</summary><label>Refreshed Notion JSON<textarea id="notion-refresh-text"></textarea></label></details><button data-action="preview-notion-refresh">Save recovery & preview refresh</button><div id="notion-refresh-preview"></div></section>`;
actions['preview-notion-refresh']=()=>{ensure(!loadError&&!migrationRaw,'Restore valid records before refreshing.');const input=parseNotionSnapshot($('#notion-refresh-text').value);refreshPreview=prepareNotionRefresh(localStorage,KEY,state.revision,input);download(`pillars-backup-before-history-refresh-${today()}-${Date.now()}.json`,encodeBackup(state));const r=refreshPreview.result;$('#notion-refresh-preview').innerHTML=`<h3>Refresh preview</h3><p>Recovery copy verified. Save the downloaded backup outside the repository.</p><p>${r.added} new source records · ${r.updated} updated source records. Existing local assessments are kept; the latest source wording remains in History.</p><p>${r.baselineChanges.length?esc(r.baselineChanges.join(' · ')):'No empty baseline fields to fill.'}</p><details><summary>Dated activities and missing-data reasons</summary>${baselineReportView(r.report)}</details><button data-action="confirm-notion-refresh">${r.changed?'Confirm history refresh':'Confirm · already up to date'}</button>`;};
actions['confirm-notion-refresh']=()=>{const r=confirmNotionRefresh(localStorage,KEY,refreshPreview);state=r.state;refreshPreview=null;page='history';render();toast(r.changed?'Notion history refreshed without duplicate records. Recorded dates affect recency only.':'This history is already up to date. No records changed.');};
document.addEventListener('change',async e=>{if(e.target.id!=='notion-refresh-file')return;try{const f=e.target.files[0];if(!f)return;ensure(f.size<3500000,'Choose a Notion history file under 3.5 MB.');$('#notion-refresh-text').value=await f.text();actions['preview-notion-refresh']();}catch(err){toast(err.message,true);}});
const setupBeforeDefaults=views.setup;
views.setup=()=>`<section class="card c12"><h2>Default Shabbat times</h2><p>Use these times every week unless that week has its own override below. These are your chosen schedule defaults; the app does not calculate religious times.</p><form id="shabbat-defaults"><div class="two">${field('Default Friday start','start',state.settings.shabbatDefaults?.start||'','time')}${field('Default Saturday end','end',state.settings.shabbatDefaults?.end||'','time')}</div><button>Save Shabbat defaults</button></form><p>For ${esc(week)}: ${shabbatFor(state,week)?esc(shabbatFor(state,week).start+' Friday – '+shabbatFor(state,week).end+' Saturday · '+(shabbatFor(state,week).source==='week'?'weekly override':'defaults')):'No times set.'}</p></section>`+setupBeforeDefaults();
submitters['shabbat-defaults']=f=>{commit(s=>saveShabbatDefaults(s,f.get('start'),f.get('end')));toast('Shabbat defaults saved. Existing weekly overrides are preserved.');};
// URL routing works on a static GitHub Pages host without a server fallback.
let applyingHash=false;
function loadPageHash(){const target=parsePageHash(location.hash);page=target.page;if(page==='route'){if(state.routeChanges?.some(r=>r.id===target.routeId)){routeEditorId=target.routeId;routeStep=0;}else page='pillars';}}
const beforeHashRender=render;
render=()=>{beforeHashRender();const active=migrationRaw?'migration':page;document.title='Pillars · '+(titles[active]||'Today');if(!migrationRaw){const hash=pageHash(page,routeEditorId);if(location.hash!==hash){if(applyingHash||!location.hash)window.history.replaceState(null,'',hash);else window.history.pushState(null,'',hash);}}if(page==='notion-refresh')$('#content').className='view-grid';const note=$('.local-note');if(note)note.innerHTML='ON THIS DEVICE<br>History, links & schedule · v2.5';};
window.addEventListener('hashchange',()=>{applyingHash=true;loadPageHash();render();applyingHash=false;});
if(!loadError&&!migrationRaw){try{state=saveActivityBaselineRepair(localStorage,KEY,state.revision);}catch(e){toast('Notion baseline repair was not saved: '+e.message,true);}}
loadPageHash();

render();</script></body></html>
